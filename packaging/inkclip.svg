<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>InkClip</title>
  <!-- clipboard body -->
  <rect x="7" y="8" width="50" height="52" rx="8" fill="#ffffff" stroke="#2b2f38" stroke-width="3.5"/>
  <!-- clip -->
  <rect x="21" y="2" width="22" height="11" rx="5.5" fill="#1a5fd0"/>
  <!-- highlighter band -->
  <rect x="15" y="31" width="34" height="10" rx="5" fill="#f2e600" opacity="0.8"/>
  <!-- ink stroke -->
  <path d="M15 39 C21 24, 27 47, 33 33 S45 25, 49 33"
        fill="none" stroke="#16181d" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ink dot -->
  <circle cx="45" cy="50" r="3.5" fill="#e02020"/>
</svg>
